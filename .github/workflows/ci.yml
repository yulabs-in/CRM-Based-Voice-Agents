name: CI

# Every pull request into dev or main, and every push to them: tests + production build.
on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Unit tests
        run: npx vitest run
      - name: Production build (Netlify preset)
        run: npm run build
        env:
          NITRO_PRESET: netlify

  e2e:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    env:
      E2E_SUPABASE_URL: ${{ secrets.E2E_SUPABASE_URL }}
      E2E_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.E2E_SUPABASE_PUBLISHABLE_KEY }}
      E2E_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.E2E_SUPABASE_SERVICE_ROLE_KEY }}
      E2E_USER_EMAIL: ${{ secrets.E2E_USER_EMAIL }}
      E2E_USER_PASSWORD: ${{ secrets.E2E_USER_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # The suite needs a dedicated test Supabase project (never production) and a test user, given as
      # repository secrets (see e2e/README.md). None set yet: skip with a notice (agreed with the repo owner
      # until the test project exists). Some set but not all: a broken setup, so fail and name what's missing.
      - name: Check E2E configuration
        id: config
        shell: bash
        run: |
          missing=()
          for key in E2E_SUPABASE_URL E2E_SUPABASE_PUBLISHABLE_KEY E2E_SUPABASE_SERVICE_ROLE_KEY E2E_USER_EMAIL E2E_USER_PASSWORD; do
            if [[ -z "${!key//[[:space:]]/}" ]]; then missing+=("$key"); fi
          done
          if (( ${#missing[@]} == 5 )); then
            echo "::notice::E2E suite skipped: the E2E_* repository secrets for the test Supabase project are not set yet. See e2e/README.md."
            echo "E2E skipped: add the five E2E_* secrets (test Supabase project + test user) to run the Playwright suite." >> "$GITHUB_STEP_SUMMARY"
            echo "ready=false" >> "$GITHUB_OUTPUT"
          elif (( ${#missing[@]} )); then
            echo "::error::Missing E2E settings: ${missing[*]}. See e2e/README.md."
            exit 1
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.config.outputs.ready == 'true'
        run: npm ci
      - name: Install Playwright Chromium
        if: steps.config.outputs.ready == 'true'
        run: npx playwright install --with-deps chromium
      - name: Run Playwright E2E suite
        if: steps.config.outputs.ready == 'true'
        run: npx playwright test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
